[caller_settings.dorado]
config = "${BASECALL_CONFIG}"
address = "${BASECALL_ADDRESS}"

[mapper_settings.pyreadbouncer]
target_files = "${RB_IBF}"
# values per experiment (experiments/*.env); kmer_size must match the index
# plugin reads error_rate, not exp_seq_error_rate (was ignored)
kmer_size = ${RB_KMER_SIZE}
error_rate = ${RB_ERROR_RATE}
chunk_length = ${RB_CHUNK_LENGTH}
threads = ${THREADS}
