[caller_settings.dorado]
config = "${BASECALL_CONFIG}"
address = "${BASECALL_ADDRESS}"

# metagraphRF with the in-process backend (pymetagraph label queries, no server)
[mapper_settings.metagraphRF]
backend = "local"
graph = "${INDEX_DIR}/mg/${DATASET}.dbg"
annotation = "${INDEX_DIR}/mg/${DATASET}.column.annodbg"
threads = ${THREADS}
num_top_labels = 1
discovery_fraction = 0.03	# HXB2 check sample, 1.2 s: 60% of targets kept, 4.6% of other reads
