[caller_settings.dorado]
config = "${BASECALL_CONFIG}"
address = "${BASECALL_ADDRESS}"

# metagraphRF, alignment mode: the 2026-03 setup (unlabeled alignment, as from the
# /align endpoint of a `metagraph server_query`), now in-process through pymetagraph
[mapper_settings.metagraphRF]
graph = "${INDEX_DIR}/mg/${DATASET}.dbg"
annotation = "${INDEX_DIR}/mg/${DATASET}.column.annodbg"
threads = ${THREADS}
mode = "align"
labeled = false
min_exact_match = 0.3	# fraction of the read covered by seeds (seeds of min(k, 19) bases)
