[caller_settings.dorado]
config = "${BASECALL_CONFIG}"
address = "${BASECALL_ADDRESS}"

# metagraphRF, label query mode (in-process through pymetagraph)
[mapper_settings.metagraphRF]
graph = "${INDEX_DIR}/mg/${DATASET}.dbg"
annotation = "${INDEX_DIR}/mg/${DATASET}.column.annodbg"
threads = ${THREADS}
mode = "query"
num_top_labels = 1
# value per experiment (experiments/*.env)
discovery_fraction = ${MG_DISCOVERY_FRACTION}
