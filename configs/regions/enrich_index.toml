# Keep reads that map anywhere in the index, eject reads that don't map.
# With targets = [] readfish classifies every mapping as "off" target
# (Targets.check_coord is always False), so *_off decides mapped reads.
[[regions]]
name = "analysis"
min_chunks = 1
max_chunks = 2
targets = []
single_on = "stop_receiving"
multi_on = "stop_receiving"
single_off = "stop_receiving"
multi_off = "stop_receiving"
no_seq = "proceed"
no_map = "unblock"
