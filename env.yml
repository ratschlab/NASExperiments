# from readfish (https://github.com/LooseLab/readfish?tab=readme-ov-file#installation)
name: selectiveseq
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools<81   # ont_fast5_api (uncalled4/sigmoni) still imports pkg_resources
  - pip:
    - readfish[all]==2024.3.0
    - pandas
    - pyfastx
    - tqdm
    - pyslow5
    - ont-pybasecall-client-lib==7.13.6
    - ont-pyguppy-client-lib==6.5.7
